name: generate-keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate a strong release keystore
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASS="$(openssl rand -base64 48 | tr -d '\n')"
          KEY_PASS="$(openssl rand -base64 48 | tr -d '\n')"
          ALIAS="brade$(openssl rand -hex 4)"
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "::add-mask::$ALIAS"

          keytool -genkeypair \
            -v \
            -keystore release-keystore.jks \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Brade and Cake House, OU=Mobile, O=Brade and Cake House, L=Addis Ababa, ST=Addis Ababa, C=ET"

          keytool -list -keystore release-keystore.jks -storepass "$STORE_PASS" > keystore-check.txt
          BASE64_KEYSTORE="$(base64 -w 0 release-keystore.jks)"

          {
            echo "ANDROID_KEYSTORE_BASE64=$BASE64_KEYSTORE"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
          } > android-signing-secrets.txt

          test -s android-signing-secrets.txt
          test -s keystore-check.txt
          echo "Keystore generated. Secrets file size: $(stat -c%s android-signing-secrets.txt) bytes."

      - name: Upload the one-time signing secrets artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-secrets
          path: |
            android-signing-secrets.txt
            keystore-check.txt
          if-no-files-found: error
          retention-days: 1

      - name: Explain how to use and protect the keystore
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Android release keystore generated

          Download the `android-signing-secrets` artifact from this run. It contains
          `android-signing-secrets.txt` with these four values:

          - `ANDROID_KEYSTORE_BASE64`
          - `ANDROID_KEYSTORE_PASSWORD`
          - `ANDROID_KEY_ALIAS`
          - `ANDROID_KEY_PASSWORD`

          Copy each value into the matching repository secret under
          **Settings -> Secrets and variables -> Actions**, then **delete the artifact**.

          > **Back up the keystore and passwords safely now.**
          > Losing them means you can never update this app on Google Play. There is
          > no recovery path. Store the downloaded file in a password manager or an
          > encrypted offline backup, not in the repository.

          > **Signing change warning:** the current published APK/AAB is debug-signed.
          > After switching to this release keystore, Android treats it as a different
          > signer. Phones that already have the debug-signed app must uninstall it
          > once, then install the new release-signed APK. Google Play will not accept
          > an update signed with a different key for an existing listing.

          The artifact is retained for **1 day** only. The workflow does not print
          the passwords to the logs.
          EOF
