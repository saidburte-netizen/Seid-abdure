name: Web build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true
      - name: Clean any stale build output
        run: flutter clean
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Validate Dart Supabase usage against the schema snapshot
        run: python3 tool/check_schema.py
      - run: flutter analyze
      - run: flutter test
      - name: Build web admin portal
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: Zip the complete web app
        run: |
          set -euo pipefail
          test -f build/web/index.html
          (cd build/web && zip -r ../../brade-cake-house-web.zip .)
          test -f brade-cake-house-web.zip
          unzip -l brade-cake-house-web.zip | tee web-files.txt
          grep -q "index.html" web-files.txt
          grep -q "main.dart.js" web-files.txt
          grep -q "assets/branding/logo.png" web-files.txt
          echo "WEB_ZIP_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $(stat -c%s brade-cake-house-web.zip)/1048576}") MB"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brade-cake-house-web
          if-no-files-found: error
          path: brade-cake-house-web.zip


  deploy-pages:
    if: github.event_name == 'workflow_dispatch' && vars.ENABLE_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: brade-cake-house-web
          path: .
      - run: unzip -o brade-cake-house-web.zip -d build/web
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
