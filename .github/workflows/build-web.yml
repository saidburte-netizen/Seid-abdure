name: Web build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true
      - name: Clean any stale build output
        run: flutter clean
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Validate Dart Supabase usage against the schema snapshot
        run: python3 tool/check_schema.py
      - run: flutter analyze
      - run: flutter test
      - name: Build web admin portal
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: Zip the complete web app
        run: |
          set -euo pipefail
          test -f build/web/index.html
          (cd build/web && zip -r ../../brade-cake-house-web.zip .)
          test -f brade-cake-house-web.zip
          unzip -l brade-cake-house-web.zip | tee web-files.txt
          grep -q "index.html" web-files.txt
          grep -q "main.dart.js" web-files.txt
          grep -q "assets/branding/logo.png" web-files.txt
          echo "WEB_ZIP_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $(stat -c%s brade-cake-house-web.zip)/1048576}") MB"
      - uses: actions/upload-artifact@v4
        with:
          name: brade-cake-house-web
          if-no-files-found: error
          path: brade-cake-house-web.zip


  deploy-pages:
    if: github.event_name == 'workflow_dispatch' && vars.ENABLE_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: brade-cake-house-web
          path: .
      - run: unzip -o brade-cake-house-web.zip -d build/web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
