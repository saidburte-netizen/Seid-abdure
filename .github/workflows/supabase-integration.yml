name: Supabase integration

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 3.1.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start a disposable local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          if [ -f supabase/migrations/20261114000001_foundation.sql ]; then
            echo "Using the uploaded 20261114 migrations."
            mkdir -p supabase/legacy_migrations
            if [ -f supabase/migrations/20261113020000_organizations_rls.sql ]; then
              mv supabase/migrations/20261113020000_organizations_rls.sql supabase/legacy_migrations/
            fi
            supabase start
          else
            echo "::warning::The 15 uploaded migrations are not present. Using the read-only live schema fixture for this disposable stack."
            mkdir -p supabase/migrations.disabled /tmp/after_fixture
            for migration in supabase/migrations/*.sql; do
              [ -e "$migration" ] || continue
              cp "$migration" /tmp/after_fixture/
            done
            find supabase/migrations -maxdepth 1 -type f -name '*.sql' -exec mv {} supabase/migrations.disabled/ \;
            supabase start
            export PGPASSWORD=postgres
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -v ON_ERROR_STOP=1 \
              -f supabase/fixtures/live_schema.sql
          fi

      - name: Apply the one-time login and storage helpers
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          for file in supabase/sql/*.sql; do
            echo "Applying $file"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -v ON_ERROR_STOP=1 \
              -f "$file"
          done

      - name: Apply post-fixture migrations
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /tmp/after_fixture ]; then
            export PGPASSWORD=postgres
            for file in /tmp/after_fixture/*.sql; do
              [ -e "$file" ] || continue
              echo "Applying $file"
              psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
                -v ON_ERROR_STOP=1 \
                -f "$file"
            done
          fi

      - name: Seed the integration role and permission catalog
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/integration/seed.sql

      - name: Run the database integration contract
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/integration/contract.sql

      - name: Show local Supabase status
        if: always()
        run: supabase status || true

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supabase-integration-logs
          path: |
            supabase/.temp/**
            /tmp/supabase*.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true
