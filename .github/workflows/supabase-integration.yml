name: Supabase integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start a disposable local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          if [ -f supabase/migrations/20261114000001_foundation.sql ]; then
            echo "Using the uploaded 20261114 migrations."
            mkdir -p supabase/legacy_migrations
            if [ -f supabase/migrations/20261113020000_organizations_rls.sql ]; then
              mv supabase/migrations/20261113020000_organizations_rls.sql supabase/legacy_migrations/
            fi
            supabase start
          else
            echo "::warning::The 15 uploaded migrations are not present. Using the read-only live schema fixture for this disposable stack."
            mkdir -p supabase/migrations.disabled
            if [ -f supabase/migrations/20261114000016_void_sale.sql ]; then
              cp supabase/migrations/20261114000016_void_sale.sql /tmp/void_sale.sql
            fi
            find supabase/migrations -maxdepth 1 -type f -name '*.sql' -exec mv {} supabase/migrations.disabled/ \;
            supabase start
            export PGPASSWORD=postgres
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -v ON_ERROR_STOP=1 \
              -f supabase/fixtures/live_schema.sql
            if [ -f /tmp/void_sale.sql ]; then
              echo "Applying the later void_sale migration after the fixture."
              psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
                -v ON_ERROR_STOP=1 \
                -f /tmp/void_sale.sql
            fi
          fi

      - name: Apply the one-time login and storage helpers
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          for file in supabase/sql/*.sql; do
            echo "Applying $file"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -v ON_ERROR_STOP=1 \
              -f "$file"
          done

      - name: Seed the integration role and permission catalog
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/integration/seed.sql

      - name: Run the database integration contract
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/integration/contract.sql

      - name: Show local Supabase status
        if: always()
        run: supabase status || true

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-integration-logs
          path: |
            supabase/.temp/**
            /tmp/supabase*.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true
