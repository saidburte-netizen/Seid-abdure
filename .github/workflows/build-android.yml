name: Android build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true

      - name: Clean any stale build output
        run: flutter clean
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Validate Dart Supabase usage against the schema snapshot
        run: python3 tool/check_schema.py
      - name: Verify the main Android manifest allows network access
        run: |
          set -euo pipefail
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_NETWORK_STATE' android/app/src/main/AndroidManifest.xml
      - run: flutter analyze
      - run: flutter test

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat > android/key.properties <<PROPS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          PROPS
            echo "SIGNING_MODE=release" >> "$GITHUB_ENV"
            echo "Release signing configured from repository secrets."
          else
            echo "SIGNING_MODE=debug" >> "$GITHUB_ENV"
            echo "::warning title=Debug-signed build::Android signing secrets are missing. The APK/AAB will be a debug-signed sideload/testing build. Google Play is not a target."
          fi

      - name: Build universal release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          cp build/app/outputs/flutter-apk/app-release.apk brade-cake-house.apk

      - name: Build release AAB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          cp build/app/outputs/bundle/release/app-release.aab brade-cake-house.aab

      - name: Build the web admin portal for the same release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          test -f build/web/index.html
          (cd build/web && zip -r ../../brade-cake-house-web.zip .)
          test -f brade-cake-house-web.zip
          unzip -l brade-cake-house-web.zip | tee web-files.txt
          grep -q "index.html" web-files.txt
          grep -q "main.dart.js" web-files.txt
          grep -q "assets/branding/logo.png" web-files.txt
          echo "WEB_ZIP_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $(stat -c%s brade-cake-house-web.zip)/1048576}") MB"

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          sha256sum \
            brade-cake-house.apk \
            brade-cake-house.aab \
            brade-cake-house-web.zip | tee sha256sums.txt

      - name: Record signing status for logs and release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          if [ "${SIGNING_MODE:-debug}" = "release" ]; then
            SIGNING_SENTENCE="This release is a **release-signed sideload/testing build**."
            SIGNING_DETAIL="The APK and AAB are signed with the repository Android keystore. This app is distributed by sideloading; Google Play is not a target for this release."
          else
            SIGNING_SENTENCE="This release is a **debug-signed sideload/testing build**."
            SIGNING_DETAIL="The APK and AAB were signed with the Android debug key because the four release-signing repository secrets are not configured. This is not a Play Store build. If Android says \"App not installed\", uninstall the previous version first; your data is safe in Supabase."
          fi
          {
            echo "## Signing status"
            echo
            echo "$SIGNING_SENTENCE"
            echo
            echo "$SIGNING_DETAIL"
            echo
            echo "## Build"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- The APK is the install file. The AAB and web ZIP are included for completeness; this release is not a Google Play submission."
          } > release-notes.md
          cat release-notes.md
          {
            echo "### Android signing"
            echo
            echo "$SIGNING_SENTENCE"
            echo
            echo "$SIGNING_DETAIL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the APK is a real installable app
        run: |
          set -euo pipefail
          APK=brade-cake-house.apk
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK_SIZE_BYTES=$SIZE"
          echo "APK_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE/1048576}") MB"
          if [ "$SIZE" -lt 15728640 ]; then
            echo "ERROR: APK is smaller than 15 MB and is probably not a complete Flutter app."
            exit 1
          fi
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT=$(find "$SDK/build-tools" -name aapt 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$AAPT" ]; then
            echo "ERROR: aapt not found in Android SDK build-tools."
            exit 1
          fi
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='net.bradeandcake.brade_and_cake_house'" apk-badging.txt
          grep -q "application-label:'Brade and Cake House'" apk-badging.txt
          if grep -q "application-debuggable" apk-badging.txt; then
            echo "ERROR: release APK is marked debuggable."
            exit 1
          fi
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          grep -q "android.permission.INTERNET" apk-permissions.txt
          grep -q "android.permission.ACCESS_NETWORK_STATE" apk-permissions.txt
          if unzip -p "$APK" lib/arm64-v8a/libapp.so 2>/dev/null \
              | strings \
              | grep -Eq 'SUPABASE_SERVICE_ROLE_KEY|"role"[[:space:]]*:[[:space:]]*"service_role"'; then
            echo "ERROR: a service_role key or service-role JWT is embedded in the APK."
            exit 1
          fi
          unzip -l "$APK" | tee apk-files.txt
          grep -q "assets/flutter_assets/assets/branding/logo.png" apk-files.txt
          grep -q "assets/flutter_assets/assets/branding/icon_foreground.png" apk-files.txt
          grep -q "assets/flutter_assets/assets/branding/notification_icon.png" apk-files.txt
          grep -q "assets/flutter_assets/AssetManifest" apk-files.txt
          grep -q "libapp.so" apk-files.txt
          echo "PACKAGE_NAME=net.bradeandcake.brade_and_cake_house"
          echo "APP_LABEL=Brade and Cake House"
          echo "SIGNING_MODE=${SIGNING_MODE}"
          echo "Bundled logo: assets/flutter_assets/assets/branding/logo.png"
          echo "Bundled icon foreground: assets/flutter_assets/assets/branding/icon_foreground.png"
          echo "Bundled notification icon: assets/flutter_assets/assets/branding/notification_icon.png"
          echo "Translations: en, am, om (compiled into libapp.so by flutter gen-l10n)."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: brade-cake-house-apk
          if-no-files-found: error
          path: brade-cake-house.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: brade-cake-house-aab
          if-no-files-found: error
          path: brade-cake-house.aab

      - name: Upload web ZIP
        uses: actions/upload-artifact@v4
        with:
          name: brade-cake-house-web-release
          if-no-files-found: error
          path: brade-cake-house-web.zip

      - name: Upload SHA-256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: brade-cake-house-checksums
          if-no-files-found: error
          path: sha256sums.txt

      - name: Attach Android files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Brade and Cake House ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: release-notes.md
          files: |
            brade-cake-house.apk
            brade-cake-house.aab
            brade-cake-house-web.zip
            sha256sums.txt

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: brade-cake-house-apk

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and switch languages on an emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tool/android_smoke.py brade-cake-house.apk

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-screenshots
          path: build/evidence/android-smoke
          if-no-files-found: warn
          retention-days: 7
