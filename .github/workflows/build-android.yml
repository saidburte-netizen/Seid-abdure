name: Android build

on:
  workflow_dispatch:
  push:
    branches: [fix/integration-order-smoke]
    tags: ["v*"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true

      - name: Clean any stale build output
        run: flutter clean
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Resolve build metadata
        run: |
          set -euo pipefail
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          echo "APP_VERSION=${VERSION%+*}" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=${VERSION#*+}" >> "$GITHUB_ENV"
          echo "BUILD_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "BUILD_BRANCH=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          echo "BUILD_META | version=${VERSION%+*} | build=${VERSION#*+} | sha=${GITHUB_SHA:0:7} | branch=$GITHUB_REF_NAME"
      - name: Validate Dart Supabase usage against the schema snapshot
        run: python3 tool/check_schema.py
      - name: Verify the main Android manifest allows network access
        run: |
          set -euo pipefail
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_NETWORK_STATE' android/app/src/main/AndroidManifest.xml
      - run: flutter analyze
      - run: flutter test

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat > android/key.properties <<PROPS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          PROPS
            echo "SIGNING_MODE=release" >> "$GITHUB_ENV"
            echo "Release signing configured from repository secrets."
          else
            echo "SIGNING_MODE=debug" >> "$GITHUB_ENV"
            echo "::warning title=Debug-signed build::Android signing secrets are missing. The APK/AAB will be a debug-signed sideload/testing build. Google Play is not a target."
          fi

      - name: Verify the embedded Supabase key is the anon key
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          python3 - "$SUPABASE_ANON_KEY" <<'PY'
          import base64, json, sys
          key = sys.argv[1]
          parts = key.split('.')
          if len(parts) != 3:
              raise SystemExit('SUPABASE_ANON_KEY is not a JWT; refusing to build')
          payload = json.loads(base64.urlsafe_b64decode(parts[1] + '=='))
          role = payload.get('role')
          if role != 'anon':
              raise SystemExit(f'SUPABASE_ANON_KEY role is {role!r}, expected anon')
          print('Embedded Supabase key role:', role)
          PY

      - name: Build universal release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=APP_BUILD_NUMBER="$APP_BUILD_NUMBER" \
            --dart-define=BUILD_SHA="$BUILD_SHA" \
            --dart-define=BUILD_BRANCH="$BUILD_BRANCH"
          cp build/app/outputs/flutter-apk/app-release.apk brade-cake-house.apk

      - name: Scan the release APK for leaked secrets
        run: |
          set -euo pipefail
          # Match real credential shapes, not bare prefixes. The Supabase SDK
          # ships the literal "sb_secret_" as a key-format constant, so a bare
          # prefix is a false positive; a real key has a long random body.
          pattern='-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{50,}|sb_secret_[A-Za-z0-9_-]{20,}|SUPABASE_SERVICE_ROLE_KEY'
          # Positive control: the pattern must catch a synthetic secret so a
          # broken regex cannot silently pass the scan.
          if ! printf '%s\n' 'sb_secret_ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789' | grep -E -q -e "$pattern"; then
            echo '::error::Secret-scan pattern failed its positive control.' >&2
            exit 1
          fi
          if strings brade-cake-house.apk | grep -E -q -e "$pattern"; then
            echo '::error::The APK contains a secret-like string.' >&2
            exit 1
          fi
          echo 'No secret-like strings found in the APK.'

      - name: Build release AAB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=APP_BUILD_NUMBER="$APP_BUILD_NUMBER" \
            --dart-define=BUILD_SHA="$BUILD_SHA" \
            --dart-define=BUILD_BRANCH="$BUILD_BRANCH"
          cp build/app/outputs/bundle/release/app-release.aab brade-cake-house.aab

      - name: Build the web admin portal for the same release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=APP_BUILD_NUMBER="$APP_BUILD_NUMBER" \
            --dart-define=BUILD_SHA="$BUILD_SHA" \
            --dart-define=BUILD_BRANCH="$BUILD_BRANCH"
          test -f build/web/index.html
          (cd build/web && zip -r ../../brade-cake-house-web.zip .)
          test -f brade-cake-house-web.zip
          unzip -l brade-cake-house-web.zip | tee web-files.txt
          grep -q "index.html" web-files.txt
          grep -q "main.dart.js" web-files.txt
          grep -q "assets/branding/logo.png" web-files.txt
          echo "WEB_ZIP_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $(stat -c%s brade-cake-house-web.zip)/1048576}") MB"

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          sha256sum \
            brade-cake-house.apk \
            brade-cake-house.aab \
            brade-cake-house-web.zip | tee sha256sums.txt

      - name: Record signing status for logs and release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$APP_VERSION+$APP_BUILD_NUMBER"
          SHORT_SHA="${BUILD_SHA:0:7}"
          if [ "${SIGNING_MODE:-debug}" = "release" ]; then
            SIGNING_SENTENCE="This release is a **release-signed sideload/testing build**."
            SIGNING_DETAIL="The APK and AAB are signed with the repository Android keystore. This app is distributed by sideloading; Google Play is not a target for this release."
          else
            SIGNING_SENTENCE="This release is a **debug-signed sideload/testing build**."
            SIGNING_DETAIL="The APK and AAB were signed with the Android debug key because the four release-signing repository secrets are not configured. This is not a Play Store build. If Android says \"App not installed\", uninstall the previous version first; your data is safe in Supabase."
          fi
          {
            echo "## Signing status"
            echo
            echo "$SIGNING_SENTENCE"
            echo
            echo "$SIGNING_DETAIL"
            echo
            echo "## Build"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Build number: \`$APP_BUILD_NUMBER\`"
            echo "- Commit: \`$SHORT_SHA\`"
            echo "- Branch: \`$BUILD_BRANCH\`"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- The APK is the install file. The AAB and web ZIP are included for completeness; this release is not a Google Play submission."
            echo "- Emulator smoke: login screen and en/am/om language switch always run; the signed-in dashboard and one POS sale run when the optional SMOKE_EMAIL/SMOKE_PASSWORD repository secrets are configured."
          } > release-notes.md
          cat release-notes.md
          {
            echo "### Android signing"
            echo
            echo "$SIGNING_SENTENCE"
            echo
            echo "$SIGNING_DETAIL"
            echo
            echo "### Build identity"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Build number: \`$APP_BUILD_NUMBER\`"
            echo "- Commit: \`$SHORT_SHA\`"
            echo "- Branch: \`$BUILD_BRANCH\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the APK is a real installable app
        run: |
          set -euo pipefail
          APK=brade-cake-house.apk
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK_SIZE_BYTES=$SIZE"
          echo "APK_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE/1048576}") MB"
          if [ "$SIZE" -lt 15728640 ]; then
            echo "ERROR: APK is smaller than 15 MB and is probably not a complete Flutter app."
            exit 1
          fi
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT=$(find "$SDK/build-tools" -name aapt 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$AAPT" ]; then
            echo "ERROR: aapt not found in Android SDK build-tools."
            exit 1
          fi
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='net.bradeandcake.brade_and_cake_house'" apk-badging.txt
          grep -q "application-label:'Brade and Cake House'" apk-badging.txt
          if grep -q "application-debuggable" apk-badging.txt; then
            echo "ERROR: release APK is marked debuggable."
            exit 1
          fi
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          grep -q "android.permission.INTERNET" apk-permissions.txt
          grep -q "android.permission.ACCESS_NETWORK_STATE" apk-permissions.txt
          if unzip -p "$APK" lib/arm64-v8a/libapp.so 2>/dev/null \
              | strings \
              | grep -Eq 'SUPABASE_SERVICE_ROLE_KEY|"role"[[:space:]]*:[[:space:]]*"service_role"'; then
            echo "ERROR: a service_role key or service-role JWT is embedded in the APK."
            exit 1
          fi
          unzip -l "$APK" | tee apk-files.txt
          grep -q "assets/flutter_assets/assets/branding/logo.png" apk-files.txt
          grep -q "assets/flutter_assets/assets/branding/icon_foreground.png" apk-files.txt
          grep -q "assets/flutter_assets/assets/branding/notification_icon.png" apk-files.txt
          grep -q "assets/flutter_assets/AssetManifest" apk-files.txt
          grep -q "libapp.so" apk-files.txt
          echo "PACKAGE_NAME=net.bradeandcake.brade_and_cake_house"
          echo "APP_LABEL=Brade and Cake House"
          echo "SIGNING_MODE=${SIGNING_MODE}"
          echo "Bundled logo: assets/flutter_assets/assets/branding/logo.png"
          echo "Bundled icon foreground: assets/flutter_assets/assets/branding/icon_foreground.png"
          echo "Bundled notification icon: assets/flutter_assets/assets/branding/notification_icon.png"
          echo "Translations: en, am, om (compiled into libapp.so by flutter gen-l10n)."

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brade-cake-house-apk
          if-no-files-found: error
          path: brade-cake-house.apk

      - name: Upload AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brade-cake-house-aab
          if-no-files-found: error
          path: brade-cake-house.aab

      - name: Upload web ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brade-cake-house-web-release
          if-no-files-found: error
          path: brade-cake-house-web.zip

      - name: Upload SHA-256 checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brade-cake-house-checksums
          if-no-files-found: error
          path: sha256sums.txt

      - name: Upload release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brade-cake-house-release-notes
          if-no-files-found: error
          path: release-notes.md

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: true

      - name: Build the smoke accessibility helper
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}" > tool/smoke_a11y/local.properties
          if ! (cd tool/smoke_a11y && ./gradlew :app:assembleDebug --no-daemon --console=plain) > helper-build.log 2>&1; then
            tail -n 40 helper-build.log
            tail -n 40 helper-build.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          tail -n 5 helper-build.log
          test -f tool/smoke_a11y/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: brade-cake-house-apk

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and switch languages on an emulator
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tool/android_smoke.py brade-cake-house.apk tool/smoke_a11y/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-smoke-screenshots
          path: build/evidence/android-smoke
          if-no-files-found: warn
          retention-days: 7

  # Real RLS and the full SQL contract run against a disposable local Supabase
  # stack. The release job depends on this, so a failing contract cannot
  # publish a tag.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 3.1.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start a disposable local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          if [ -f supabase/migrations/20261114000001_foundation.sql ]; then
            echo "Using the uploaded 20261114 migrations."
            mkdir -p supabase/legacy_migrations
            if [ -f supabase/migrations/20261113020000_organizations_rls.sql ]; then
              mv supabase/migrations/20261113020000_organizations_rls.sql supabase/legacy_migrations/
            fi
            supabase start
          else
            echo "::warning::The 15 uploaded migrations are not present. Using the read-only live schema fixture for this disposable stack."
            mkdir -p supabase/migrations.disabled /tmp/after_fixture
            for migration in supabase/migrations/*.sql; do
              [ -e "$migration" ] || continue
              cp "$migration" /tmp/after_fixture/
            done
            find supabase/migrations -maxdepth 1 -type f -name '*.sql' -exec mv {} supabase/migrations.disabled/ \;
            supabase start
            export PGPASSWORD=postgres
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -v ON_ERROR_STOP=1 \
              -f supabase/fixtures/live_schema.sql
          fi

      - name: Apply the one-time login and storage helpers
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          for file in supabase/sql/*.sql; do
            echo "Applying $file"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -v ON_ERROR_STOP=1 \
              -f "$file"
          done

      - name: Apply post-fixture migrations
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /tmp/after_fixture ]; then
            export PGPASSWORD=postgres
            for file in /tmp/after_fixture/*.sql; do
              [ -e "$file" ] || continue
              echo "Applying $file"
              psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
                -v ON_ERROR_STOP=1 \
                -f "$file"
            done
          fi

      - name: Seed the integration role and permission catalog
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/integration/seed.sql

      - name: Run the database integration contract and real RLS
        shell: bash
        run: |
          set -uo pipefail
          export PGPASSWORD=postgres
          log="$RUNNER_TEMP/contract.log"
          set +e
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/integration/contract.sql 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "### Database contract failure"
              echo
              echo '```'
              tail -n 40 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 20 "$log" | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$status"
          fi

      # The minimum-field seed creates two extra auth users, so it must run
      # after the profile-count assertions in contract.sql. The generated
      # contract below needs the seed, and this order matches the local
      # tool/run_contract_local.sh runner.
      - name: Seed the minimum-field payload contract fixtures
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/integration/minimum_fields_seed.sql

      - name: Run the generated minimum-field payload contract
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/integration/minimum_fields_contract.sql

      - name: Show local Supabase status
        if: always()
        run: supabase status || true

  # Publishing is a separate job so the APK is only released after the R8
  # smoke test, APK secret scan and real-RLS contract have all passed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: brade-cake-house-apk
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: brade-cake-house-aab
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: brade-cake-house-web-release
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: brade-cake-house-checksums
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: brade-cake-house-release-notes
          path: release-assets
      - name: Publish the verified release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Brade and Cake House ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: release-assets/release-notes.md
          # The release and its tag may already exist because the owner publishes
          # the release from the GitHub web UI (tag created on publish). This
          # action updates an existing release by tag instead of failing, and
          # overwrite_files replaces same-named assets on a re-run. The unmatched
          # guard fails loudly rather than publishing an incomplete release.
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/brade-cake-house.apk
            release-assets/brade-cake-house.aab
            release-assets/brade-cake-house-web.zip
            release-assets/sha256sums.txt
