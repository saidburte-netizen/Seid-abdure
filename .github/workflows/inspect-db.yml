name: Inspect live database schema

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download PostgREST OpenAPI schema
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          curl -fsS "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Accept: application/openapi+json" \
            -o openapi.json
          for table in permissions roles role_permissions app_settings; do
            curl -fsS "$SUPABASE_URL/rest/v1/$table?select=*" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -o "data-$table.json"
          done
          curl -fsS "$SUPABASE_URL/storage/v1/bucket" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -o data-buckets.json || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('openapi.json').read_text())
          paths = d.get('paths', {})
          defs = d.get('definitions', {})
          print('paths', len(paths), 'definitions', len(defs))
          with Path('schema-summary.txt').open('w') as f:
              for name in sorted(defs):
                  props = defs[name].get('properties', {})
                  f.write(f'{name}: ' + ', '.join(f'{k}:{v.get("type", v.get("format", "?"))}' for k, v in props.items()) + '\n')
              f.write('\nRPC PATHS\n')
              for path in sorted(paths):
                  if path.startswith('/rpc/'):
                      f.write(path + '\n')
          print(Path('schema-summary.txt').read_text()[:4000])
          PY

      - name: Check anon key and live constraints
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.error

          url = os.environ['SUPABASE_URL'].rstrip('/')
          anon = os.environ['SUPABASE_ANON_KEY']
          token = os.environ['SUPABASE_ACCESS_TOKEN']
          ref = url.split('//', 1)[1].split('.', 1)[0]
          print('project_ref:', ref)

          def jwt_claims(value):
              try:
                  payload = value.split('.')[1]
                  payload += '=' * (-len(payload) % 4)
                  return json.loads(base64.urlsafe_b64decode(payload))
              except Exception as exc:
                  return {'decode_error': type(exc).__name__}

          claims = jwt_claims(anon)
          print('anon_key_role:', claims.get('role'))
          print('anon_key_ref:', claims.get('ref'))
          print('anon_key_issuer:', claims.get('iss'))

          def status(path, headers):
              req = urllib.request.Request(url + path, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status
              except urllib.error.HTTPError as exc:
                  return exc.code
              except Exception as exc:
                  return type(exc).__name__

          anon_headers = {'apikey': anon, 'Authorization': 'Bearer ' + anon}
          print('anon_auth_settings_status:', status('/auth/v1/settings', anon_headers))
          print('anon_rest_status:', status('/rest/v1/', anon_headers))
          print('anon_rest_permissions_status:', status('/rest/v1/permissions?select=code&limit=1', anon_headers))

          sql = """
          select 'trigger' as kind, event_object_table as object_name, trigger_name as name,
                 action_timing || ' ' || event_manipulation as detail
          from information_schema.triggers
          where event_object_table in (
            'goods_receipt_items','purchase_order_items','sale_items','sale_payments','sales',
            'sale_return_items','receivable_payments','payable_payments','rent_payments',
            'payroll_runs','production_batches','write_offs','bills','payables'
          )
          union all
          select 'constraint', conrelid::regclass::text, conname, pg_get_constraintdef(oid)
          from pg_constraint
          where conrelid::regclass::text in (
            'goods_receipt_items','purchase_order_items','sale_items','sale_payments','sales',
            'sale_return_items','receivable_payments','payable_payments','rent_payments',
            'payroll_runs','production_batches','write_offs','bills','payables'
          )
          union all
          select 'policy', tablename, policyname, cmd || ' | ' || coalesce(qual, '') || ' | ' || coalesce(with_check, '')
          from pg_policies
          where tablename in ('notifications','notification_settings','profiles','sales')
          order by 1,2,3
          """
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as response:
                  rows = json.load(response)
              for row in rows:
                  print(json.dumps(row, ensure_ascii=False))
          except urllib.error.HTTPError as exc:
              print('management_query_status:', exc.code)
              print(exc.read().decode()[:2000])
          except Exception as exc:
              print('management_query_error:', type(exc).__name__, str(exc)[:500])
          PY


      - name: Inspect trigger functions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          url = os.environ['SUPABASE_URL'].rstrip('/')
          token = os.environ['SUPABASE_ACCESS_TOKEN']
          ref = url.split('//', 1)[1].split('.', 1)[0]
          sql = """
          select p.proname, pg_get_functiondef(p.oid) as definition
          from pg_proc p
          join pg_trigger t on t.tgfoid = p.oid
          where t.tgname in (
            'trg_sale_payments_apply','trg_receivable_payments_apply',
            'trg_payable_payments_apply','trg_rent_payments_apply',
            'trg_receipt_items_stock','trg_sale_items_stock','trg_return_items_stock',
            'trg_write_offs_approved','trg_batches_completed','trg_payroll_status',
            'trg_sales_void','trg_payables_created'
          )
          order by p.proname
          """
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as response:
                  rows = json.load(response)
              for row in rows:
                  print('FUNCTION', row['proname'])
                  print(row['definition'])
                  print('END FUNCTION')
          except urllib.error.HTTPError as exc:
              print('management_query_status:', exc.code)
              print(exc.read().decode()[:2000])
          PY


      - name: Inspect first-user profile trigger
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          url = os.environ['SUPABASE_URL'].rstrip('/')
          token = os.environ['SUPABASE_ACCESS_TOKEN']
          ref = url.split('//', 1)[1].split('.', 1)[0]
          sql = """
          select p.proname, pg_get_functiondef(p.oid) as definition
          from pg_proc p
          join pg_trigger t on t.tgfoid = p.oid
          join pg_class c on c.oid = t.tgrelid
          join pg_namespace n on n.oid = c.relnamespace
          where n.nspname = 'auth' and c.relname = 'users'
          order by p.proname
          """
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as response:
                  rows = json.load(response)
              for row in rows:
                  print('FUNCTION', row['proname'])
                  print(row['definition'])
                  print('END FUNCTION')
          except urllib.error.HTTPError as exc:
              print('management_query_status:', exc.code)
              print(exc.read().decode()[:2000])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: live-db-schema
          if-no-files-found: error
          path: |
            openapi.json
            schema-summary.txt
            data-*.json
