name: dump-live-schema

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump the live public schema (read-only, schema only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          supabase link \
            --project-ref nmrpmypgkljmtnsvmcfn \
            --password "$SUPABASE_DB_PASSWORD"
          supabase db dump \
            --schema public \
            --file live-public-schema.sql
          test -s live-public-schema.sql
          wc -l live-public-schema.sql

      - name: Upload the schema-only fixture
        uses: actions/upload-artifact@v4
        with:
          name: live-public-schema
          path: live-public-schema.sql
          if-no-files-found: error
          retention-days: 1
