name: dump-live-schema

on:
  workflow_dispatch:

concurrency:
  group: dump-live-schema-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Generate a schema-only fixture through the read-only Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: nmrpmypgkljmtnsvmcfn
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/dump_live_schema.py \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --out supabase/fixtures/live_schema.sql
          test -s supabase/fixtures/live_schema.sql
          wc -l supabase/fixtures/live_schema.sql

      - name: Upload the schema-only fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-schema-fixture
          path: supabase/fixtures/live_schema.sql
          if-no-files-found: error
          retention-days: 1
