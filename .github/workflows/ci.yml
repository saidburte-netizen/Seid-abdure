name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'supabase/legacy_migrations/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Verify generated minimum-field artifacts are current
        run: |
          set -euo pipefail
          python3 tool/minimum_fields.py
          python3 tool/generate_minimum_contract.py
          git diff --exit-code -- docs/MINIMUM_FIELDS.md supabase/tests/integration/minimum_fields_seed.sql supabase/tests/integration/minimum_fields_contract.sql
      - name: Validate Dart Supabase usage against the schema snapshot
        run: python3 tool/check_schema.py
      - name: Drift test — app schema vs live schema snapshot
        run: python3 tool/payload_drift_test.py
      - name: Enforce the shared save flow for every database write
        run: python3 tool/check_save_flow.py
      - name: Verify the main Android manifest allows network access
        run: |
          set -euo pipefail
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_NETWORK_STATE' android/app/src/main/AndroidManifest.xml
      # Run `tool/format.sh` locally before pushing. CI only verifies the
      # result; it never rewrites files, commits, or pushes formatting changes.
      - run: dart format --output=none --set-exit-if-changed lib test
      - name: Reject empty handlers and unfinished placeholders
        run: bash tool/check_placeholders.sh
      - name: Keep legacy migrations out of the active folder
        run: |
          set -euo pipefail
          test -d supabase/legacy_migrations
          if find supabase/migrations -maxdepth 1 -type f -name '20261113*.sql' | grep -q .; then
            echo "ERROR: a legacy 20261113 migration is in supabase/migrations."
            echo "Move it to supabase/legacy_migrations/ so it cannot be applied."
            exit 1
          fi
      - run: flutter analyze
      - name: Verify Oromo routes, live switching, formatting, and translations
        run: |
          flutter test \
            test/all_routes_localization_test.dart \
            test/navigation_back_test.dart \
            test/formatting_test.dart \
            test/l10n_catalog_test.dart \
            test/oromo_localizations_test.dart
      - name: Run full Flutter test suite
        run: flutter test
      - name: Upload UI screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-screenshots
          path: build/ui_screenshots
          if-no-files-found: error
          retention-days: 30
      - name: Scan dependencies for known vulnerabilities
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner --version
          /tmp/osv-scanner scan source -L pubspec.lock

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan the full git history for committed secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
