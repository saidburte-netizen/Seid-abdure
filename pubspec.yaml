name: brade_and_cake_house
description: Brade and Cake House bakery and shop full management system.
publish_to: none
version: 1.0.1+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^6.1.4
  excel: ^4.0.6
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  http: ^1.2.2
  intl: ^0.20.2
  path_provider: ^2.1.5
  pdf: ^3.11.3
  share_plus: ^10.1.4
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.8.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/logo.png"
  adaptive_icon_background: "#F4E8D8"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/branding/logo.png"
    background_color: "#F4E8D8"
    theme_color: "#0B3B17"
  windows:
    generate: true
    image_path: "assets/branding/logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/branding/logo.png"
  linux:
    generate: true
    image_path: "assets/branding/logo.png"

flutter_native_splash:
  color: "#F4E8D8"
  color_dark: "#06210F"
  image: assets/branding/logo.png
  image_dark: assets/branding/logo.png
  android_12:
    image: assets/branding/logo.png
    color: "#F4E8D8"
    color_dark: "#06210F"
  web: false
